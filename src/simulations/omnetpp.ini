[General]
network = src.modules.Obs6OBS
sim-time-limit = 5s

# === CONFIGURACIÓN ESTRICTA PARA CMDENV (CONSOLA) ===
user-interface = Cmdenv
cmdenv-interactive = false
cmdenv-express-mode = true
cmdenv-status-frequency = 5s
cmdenv-performance-display = true

output-scalar-file = results/${configname}-${runnumber}.sca
output-vector-file = results/${configname}-${runnumber}.vec

**.edge*.reportInterval = 0.05s
**.edge*.LmaxTotal = 100000
**.edge*.TmaxTotal = 0.05s
**.edge*.coreProcessingTime = 10us
**.edge*.ackTimeout = 0.02s

*.ctrl.decisionInterval = 0.05s
*.ctrl.ewmaAlpha = 0.3
*.ctrl.Lmin = 10000
*.ctrl.Lmax = 100000
*.ctrl.Tmin = 0.01s
*.ctrl.Tmax = 0.1s
# P1-C: Latencia real del controlador SDN (5ms por defecto, configurable por escenario)
*.ctrl.controllerDelay = 0.005s
*.ctrl.agentInFile = "agent_in.json"
*.ctrl.agentOutFile = "agent_out.json"

# NOTA: Flujo en anillo para involucrar todos los nodos y enlaces.
*.edgeA.dstEdgeId = 1
*.edgeB.dstEdgeId = 2
*.edgeC.dstEdgeId = 0

# Los enlaces usan 5 canales de 10Gbps (50Gbps totales)

# =============================================================
# ESCENARIOS ORIGINALES — Tráfico Variable Senoidal
# =============================================================

[Config SinAgente_Variable]
description = OBS estatico, trafico variable senoidal (Pico superando 50Gbps)
repeat = 3
*.ctrl.enableAgent = false
*.user*.isVariableTraffic = true
*.user*.varPeriod = 1s
*.user*.varAmplitude = 0.8

*.userA.rate = 2000000
*.userB.rate = 2000000
*.userC.rate = 200000

[Config ConAgente_Variable]
description = OBS con agente, trafico variable senoidal (Pico superando 50Gbps)
repeat = 3
*.ctrl.enableAgent = true
*.user*.isVariableTraffic = true
*.user*.varPeriod = 1s
*.user*.varAmplitude = 0.8
*.userA.rate = 2000000
*.userB.rate = 2000000
*.userC.rate = 200000

# =============================================================
# P3-A: ESCENARIOS DE ALTA CARGA (~70% de 50 Gbps)
# Objetivo: demostrar diferencia significativa en Pb
# 50Gbps × 0.70 / 3 nodos / 8 bits ≈ 1,458,333 pps/nodo
# Distribución DiffServ: EF=10%, AF=40%, BE=50%
# =============================================================

[Config SinAgente_AltaCarga]
description = OBS estatico, carga fija al 70% del canal DWDM 50Gbps
repeat = 3
*.ctrl.enableAgent = false
*.user*.isVariableTraffic = false
*.userA.rate = 145833    # EF: 10% de 1,458,333 pps
*.userB.rate = 583333    # AF: 40%
*.userC.rate = 729167    # BE: 50%

[Config ConAgente_AltaCarga]
description = OBS con agente, carga fija al 70% del canal DWDM 50Gbps
repeat = 3
*.ctrl.enableAgent = true
*.user*.isVariableTraffic = false
*.userA.rate = 145833
*.userB.rate = 583333
*.userC.rate = 729167

# =============================================================
# P3-A VARIANTE: ALTA CARGA + TRÁFICO VARIABLE
# El escenario más exigente para el agente
# =============================================================

[Config SinAgente_AltaCarga_Variable]
description = OBS estatico, carga 70% + variacion senoidal (picos hasta 100%)
repeat = 3
*.ctrl.enableAgent = false
*.user*.isVariableTraffic = true
*.user*.varPeriod = 1s
*.user*.varAmplitude = 0.4   # Pico: 70% × 1.4 = 98% del enlace
*.userA.rate = 145833
*.userB.rate = 583333
*.userC.rate = 729167

[Config ConAgente_AltaCarga_Variable]
description = OBS con agente, carga 70% + variacion senoidal (picos hasta 100%)
repeat = 3
*.ctrl.enableAgent = true
*.user*.isVariableTraffic = true
*.user*.varPeriod = 1s
*.user*.varAmplitude = 0.4
*.userA.rate = 145833
*.userB.rate = 583333
*.userC.rate = 729167

# =============================================================
# ENTRENAMIENTO MASIVO DiffServ
# =============================================================

# =============================================================
# ENTRENAMIENTO MASIVO DiffServ
# =============================================================

[Config BatchTraining]
description = Entrenamiento Masivo DiffServ escalado para DWDM 50Gbps (10 niveles x 5 seeds)
repeat = 5
seed-set = ${repetition}
*.ctrl.enableAgent = true
*.user*.isVariableTraffic = false

# Barrido de 10 niveles EN PARALELO (Enganchados a la variable principal rateEF)
*.userA.rate = ${rateEF=  31250,   62500,   93750,  125000,  156250,  187500,  218750,  250000,  281250,  312500}
*.userB.rate = ${rateAF= 125000,  250000,  375000,  500000,  625000,  750000,  875000, 1000000, 1125000, 1250000 !rateEF}
*.userC.rate = ${rateBE= 156250,  312500,  468750,  625000,  781250,  937500, 1093750, 1250000, 1406250, 1562500 !rateEF}
