[General]
network = src.modules.Obs4U3E3C
sim-time-limit = 0.12s
load-libs = ../../../out/clang-release/src/RedGrande

# =========================
# Controlador / agente
# =========================
*.ctrl.reqFile = "../../python-agent/runtime/state.txt"
*.ctrl.respFile = "../../python-agent/runtime/reply.txt"
*.ctrl.replyDelay = 0.0005s

# =========================
# Parámetros generales Edge
# =========================
**.edge*.period = 0.002s
**.edge*.pktBytes = 200B
**.edge*.offsetBase = 0.003s

# =========================
# Destinos por Edge
# =========================
**.edgeA.dstId = 1
**.edgeB.dstId = 2
**.edgeC.dstId = 0

# =========================
# Límites por servicio
# (los de tu modelo, por si luego los usas)
# =========================
**.edge*.TmaxVoice = 0.008s
**.edge*.TmaxData  = 0.015s
**.edge*.TmaxVideo = 0.025s

**.edge*.LmaxVoice = 24
**.edge*.LmaxData  = 40
**.edge*.LmaxVideo = 100

# =========================
# Modo mixto base
# =========================
**.edge*.LmaxTotal = 24
**.edge*.TmaxTotal = 0.01s

# =========================
# Tasas base de llegada
# =========================
**.edge*.rateVoice = 500
**.edge*.rateData  = 300
**.edge*.rateVideo = 200

# =========================
# Registro de resultados
# =========================
output-scalar-file = results/${configname}-rep${repetition}.sca
output-vector-file = results/${configname}-rep${repetition}.vec

# =========================================================
# CONFIG 1: ESTATICO
# Red sin agente/adaptación
# =========================================================
[Config StaticTest]
description = "Escenario estatico sin adaptacion"
repeat = 3
seed-set = ${repetition}

*.ctrl.queryPeriod = 0.002s

# Si tu SDController tiene flag de uso del agente:
# *.ctrl.useAgent = false

# Si no tienes flag y desactivas por periodo:
# pones el query muy grande para que no actue en la simulacion
# *.ctrl.queryPeriod = 1000s

# Mantener parametros fijos
**.edge*.LmaxTotal = 24
**.edge*.TmaxTotal = 0.01s

# Si Edge.cc tiene fases de trafico, aquí idealmente las desactivas
# con un parametro tipo:
# **.edge*.useTrafficPhases = false

# =========================================================
# CONFIG 2: DINAMICO
# Red con agente/adaptación
# =========================================================
[Config DynamicTest]
description = "Escenario dinamico con agente"
repeat = 3
seed-set = ${repetition}

*.ctrl.queryPeriod = 0.002s
*.ctrl.replyDelay = 0.0005s
*.ctrl.reqFile = "../../python-agent/runtime/state.txt"
*.ctrl.respFile = "../../python-agent/runtime/reply.txt"

# Si tu SDController tiene flag:
# *.ctrl.useAgent = true

# Base inicial; luego el agente los cambia
**.edge*.LmaxTotal = 24
**.edge*.TmaxTotal = 0.01s

# Si Edge.cc tiene fases:
# **.edge*.useTrafficPhases = true
